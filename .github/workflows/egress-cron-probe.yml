name: T6 Egress Cron Probe

on:
  schedule:
    # Ein Platzhalter-Cron (jede Stunde). 
    # Wir wollen aber nicht warten, daher der nächste Befehl:
    - cron: '0 * * * *'
  # GANZ WICHTIG: Das erlaubt uns, den Workflow im Actions-Tab 
  # sofort manuell per Button zu starten (Stufe 1 Testlauf).
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch and Run Sonde
        run: |
          # Claudes Fallback-Logik: Wir holen das Skript vom Probe-Branch, 
          # falls dieser Workflow auf 'main' läuft.
          git fetch origin research/t6-egress-probe
          git checkout origin/research/t6-egress-probe -- tools/afk-egress-probe.sh
          
          # Ausführung mit dem 'cron'-Label, wie von Claude in Stufe 1 definiert.
          bash tools/afk-egress-probe.sh cron
